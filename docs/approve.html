<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Approval Dashboard</title><link rel="stylesheet" href="./assets/styles.css"></head><body>
<header class="site-header"><div class="site-header__inner"><div class="brand"><span class="brand__mark">DC</span><span><strong>Approval Dashboard</strong><small>Access Request Approval</small></span></div></div></header><div id="mode-banner" class="mode-banner" hidden></div>
<main><section id="login-panel" class="login-shell" hidden><form id="login-form" class="login-card"><p class="eyebrow">Authorized Access</p><h1>เข้าสู่ระบบผู้อนุมัติ</h1><label>Email<input id="admin-email" type="email" required></label><label>Password<input id="admin-password" type="password" required></label><p id="login-error" class="error-message" hidden></p><button class="button button--primary">เข้าสู่ระบบ</button></form></section>
<section id="dashboard" class="container container--wide" hidden><div class="hero"><div><p class="eyebrow">Approval</p><h1>รายการรออนุมัติ</h1><p>ตรวจสอบและอนุมัติคำขอ พร้อมดูข้อมูลเวลาและบัตรที่ รปภ. บันทึกได้แบบอ่านอย่างเดียว</p></div><div class="dashboard-toolbar"><button id="refresh-button" class="button button--secondary">รีเฟรช</button><button id="logout-button" class="button button--ghost">ออกจากระบบ</button></div></div>
<section class="panel"><div class="filters"><label>ค้นหา<input id="search" type="search" placeholder="เลขคำขอ ชื่อ บริษัท โครงการ"></label><label>สถานะ<select id="status-filter"><option value="pending">รอตรวจสอบ</option><option value="">ทั้งหมด</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่อนุมัติ</option><option value="completed">เสร็จสิ้น</option></select></label><label>วันที่<input id="date-filter" type="date"></label></div><div class="table-wrap"><table><thead><tr><th>Request</th><th>Location</th><th>Project / Room</th><th>Date</th><th>People</th><th>Status</th><th></th></tr></thead><tbody id="request-table-body"></tbody></table></div><div id="empty-state" class="empty-state">ไม่มีรายการ</div></section></section></main>
<div id="detail-panel" class="detail-overlay" hidden><aside id="detail-content" class="detail-drawer"></aside></div>
<script src="./assets/config.js?v=20" defer></script>
<script src="./assets/common.js?v=20" defer></script>
<script src="./assets/approve.js?v=36" defer></script>
<script src="./assets/fr333.js?v=1" defer></script>
<script src="./assets/approve-fr333.js?v=1" defer></script>
</body></html>
